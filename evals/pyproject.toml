[project]
name = "shelfsense-evals"
version = "0.1.0"
description = "Golden dataset, scorers and CLI runner for the ShelfSense vision and planner agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "shelfsense-api",
    "typer>=0.27,<1",
    "rich>=15.0",
]

[project.scripts]
shelfsense-evals = "shelfsense_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsense_evals"]
