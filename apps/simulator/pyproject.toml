[project]
name = "shelfsense-simulator"
version = "0.1.0"
description = "Publishes synthetic fridge temperature and GPS telemetry over MQTT for local development and evals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27,<1",
]

[project.scripts]
shelfsense-simulator = "shelfsense_simulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsense_simulator"]
