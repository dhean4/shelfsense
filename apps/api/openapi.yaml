# ShelfSense API contract. Written BEFORE the routes; tests/test_contract.py fails when the
# implementation's generated document stops honouring anything declared here. Additions in
# the implementation (e.g. FastAPI's automatic 422) are allowed; omissions are not.
openapi: 3.1.0
info:
  title: ShelfSense API
  version: 0.1.0
  description: Shelf photos and cold-chain telemetry in, reviewed decisions out.

tags:
  - name: health
  - name: identity
  - name: stores
  - name: shelves
  - name: skus
  - name: planograms
  - name: photos
  - name: tools
  - name: runs
  - name: actions
  - name: review
  - name: telemetry
  - name: usage

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      responses:
        "200":
          description: Every dependency answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: At least one dependency failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }

  /v1/me:
    get:
      tags: [identity]
      summary: Who am I
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/stores:
    get:
      tags: [stores]
      summary: List stores
      responses:
        "200":
          description: Stores in the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [stores]
      summary: Create store (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/stores/{store_id}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [stores]
      summary: Get store
      responses:
        "200":
          description: The store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stores/{store_id}/shelves:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags: [stores]
      summary: List shelves in a store
      responses:
        "200":
          description: Shelves by position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShelfOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [stores]
      summary: Create shelf (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelfIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/shelves/{shelf_id}:
    parameters:
      - $ref: "#/components/parameters/ShelfId"
    get:
      tags: [shelves]
      summary: Get shelf
      responses:
        "200":
          description: The shelf
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/shelves/{shelf_id}/planogram:
    parameters:
      - $ref: "#/components/parameters/ShelfId"
    get:
      tags: [planograms]
      summary: Get planogram
      responses:
        "200":
          description: The shelf's planogram
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanogramOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [planograms]
      summary: Replace planogram (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanogramIn" }
      responses:
        "200":
          description: The new planogram version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanogramOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/skus:
    get:
      tags: [skus]
      summary: List SKUs
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: SKUs by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SkuOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [skus]
      summary: Create SKU (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkuIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkuOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/shelves/{shelf_id}/photos:
    parameters:
      - $ref: "#/components/parameters/ShelfId"
    get:
      tags: [photos]
      summary: List photos of a shelf
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PhotoOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [photos]
      summary: Upload a shelf photo (owner, manager, field_agent)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Stored and queued for extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Not an image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/photos/{photo_id}:
    parameters:
      - name: photo_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [photos]
      summary: Get a photo and its extraction
      responses:
        "200":
          description: The photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tools:
    get:
      tags: [tools]
      summary: Tools the caller's role may invoke
      responses:
        "200":
          description: Tool specs with JSON Schemas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolSpecOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tools/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tools]
      summary: Run a tool directly (logged like a planner call)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Result or tool-level error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolRunOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/runs:
    get:
      tags: [runs]
      summary: List agent runs
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [runs]
      summary: One run with tool calls and actions
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/extractions/{extraction_id}/plan:
    parameters:
      - name: extraction_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [runs]
      summary: Queue a planner run over an extraction (owner, manager, field_agent)
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunQueued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/actions:
    get:
      tags: [actions]
      summary: List actions
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ActionStatus" }
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ActionKind" }
        - name: store_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActionOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/actions/{action_id}:
    parameters:
      - name: action_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [actions]
      summary: One action
      responses:
        "200":
          description: The action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/review/queue:
    get:
      tags: [review]
      summary: Pending actions and low-confidence extractions (owner, manager, reviewer)
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueueOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/actions/{action_id}/approve:
    parameters:
      - name: action_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Approve an action, optionally editing a reorder quantity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionDecisionIn" }
      responses:
        "200":
          description: The approved action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/actions/{action_id}/reject:
    parameters:
      - name: action_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Reject an action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionDecisionIn" }
      responses:
        "200":
          description: The rejected action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/extractions/{extraction_id}/review:
    parameters:
      - name: extraction_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Record a verdict on an extraction (a labelled example)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionReviewIn" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionReviewOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/labels:
    get:
      tags: [review]
      summary: Stored verdicts
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtractionReviewOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/labels/{review_id}/promote:
    parameters:
      - name: review_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Promote a verdict into the golden set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteIn" }
      responses:
        "201":
          description: The golden case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldenCaseOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/golden:
    get:
      tags: [review]
      summary: Golden cases
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoldenCaseOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/devices:
    get:
      tags: [telemetry]
      summary: Devices with latest reading and open anomaly
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [telemetry]
      summary: Register a device (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/devices/{device_id}/telemetry:
    parameters:
      - name: device_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [telemetry]
      summary: Readings for a device, newest first
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: [string, "null"], format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReadingOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/anomalies:
    get:
      tags: [telemetry]
      summary: Cold-chain excursions
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AnomalyStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnomalyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/telemetry:
    post:
      tags: [telemetry]
      summary: Ingest readings over HTTP (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestIn" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/telemetry/stream:
    get:
      tags: [telemetry]
      summary: Server-sent events of readings and anomalies for the tenant
      responses:
        "200":
          description: text/event-stream
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/telemetry/summary:
    get:
      tags: [telemetry]
      summary: Counts for dashboard tiles
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/usage:
    get:
      tags: [usage]
      summary: Cost, tokens and latency of runs over the last N days
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        "200":
          description: Aggregates by day, by model, and the costliest runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  parameters:
    StoreId:
      name: store_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShelfId:
      name: shelf_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Body or parameters failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPValidationError" }

  schemas:
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [ok] }

    CheckResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, fail] }
        detail: { type: [string, "null"] }

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
