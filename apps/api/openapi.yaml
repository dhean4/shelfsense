      type: object
      required: [sku_id, position, expected_facings, min_facings]
      properties:
        sku_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        expected_facings: { type: integer, minimum: 1, maximum: 100 }
        min_facings: { type: integer, minimum: 0, maximum: 100 }

    PlanogramIn:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
