    SkuOut:
      type: object
      required: [id, name, brand, barcode, category, unit_price_kobo, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        brand: { type: string }
        barcode: { type: string }
        category: { type: string }
        unit_price_kobo: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

