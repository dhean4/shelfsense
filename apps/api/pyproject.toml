[project]
name = "shelfsense-api"
version = "0.1.0"
description = "ShelfSense HTTP API: uploads, agent runs, review queue, telemetry ingest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "asyncpg>=0.31",
    "redis>=8.1,<9",
]

[project.scripts]
shelfsense-api = "shelfsense_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsense_api"]
