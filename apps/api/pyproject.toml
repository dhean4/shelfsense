[project]
name = "shelfsense-api"
version = "0.1.0"
description = "ShelfSense HTTP API: uploads, agent runs, review queue, telemetry ingest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "alembic>=1.20,<2",
    "asyncpg>=0.31",
    "redis>=8.1,<9",
    "aiobotocore>=3.9,<4",
    "pyjwt[crypto]>=2.15,<3",
    "typer>=0.27,<1",
    "anthropic>=1.8,<2",
    "pillow>=12.3,<13",
    "aiomqtt>=2.5,<3",
    "langfuse>=4.15,<5",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "prometheus-client>=0.26,<1",
    "shelfsense-simulator",
]

[project.scripts]
shelfsense-api = "shelfsense_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsense_api"]
